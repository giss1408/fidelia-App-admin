name: fidelia_admin
description: Fidelia Admin - private app for the Fidelia team to manage accounts.
publish_to: none

# versionCode+versionName. Bump the build number on every release build.
version: 0.1.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter

  # State management. No codegen.
  flutter_riverpod: ^2.5.1

  # Tokens in the Android Keystore, never in SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # HTTP with explicit timeouts and gzip.
  http: ^1.2.2

  # Opens WhatsApp (wa.me) to send codes and temporary passwords.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # The brand display face, same file as Fidelia Pro (SIL OFL, assets/fonts/OFL.txt).
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
